<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeno — Sophetic</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;
 src:url("/assets/fonts/InstrumentSerif-Regular.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:300;font-display:swap;
 src:url("/assets/fonts/SpaceGrotesk-Light.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:400;font-display:swap;
 src:url("/assets/fonts/SpaceGrotesk-Regular.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;
 src:url("/assets/fonts/SpaceGrotesk-Medium.woff2") format("woff2")}
</style>
<style>
:root{
  --void:#000; --paper:#F4F4F1; --ash:#7E7E82; --dust:#3E3E42; --hair:#1B1B1D; --side:#0A0A0B;
  --e:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);
 font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;font-weight:300;
 font-size:14.5px;-webkit-font-smoothing:antialiased;overflow:hidden}
.s{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
a{color:inherit}
button{font:inherit}
::selection{background:var(--paper);color:var(--void)}

.app{height:100dvh;display:flex}

/* sidebar */
.sb{width:252px;flex:none;background:var(--side);border-right:1px solid var(--hair);
 display:flex;flex-direction:column;padding:16px 0}
.sb .brand{display:flex;align-items:center;gap:9px;padding:2px 18px 18px;text-decoration:none;color:var(--paper)}
.sb .brand b{font-family:"Instrument Serif",serif;font-weight:400;font-size:19px}
.newchat{margin:0 14px 16px;padding:10px 12px;border:1px solid var(--hair);
 display:flex;align-items:center;gap:9px;font-size:13px;color:var(--paper);cursor:default}
.sbl{padding:0 18px 8px;font-size:10.5px;color:var(--dust);letter-spacing:.04em}
.hist{flex:1;overflow-y:auto}
.hist div{padding:8px 18px;font-size:12.5px;color:var(--ash);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.hist div.cur{background:#111113;color:var(--paper);box-shadow:inset 2px 0 0 var(--paper)}
.sbfoot{border-top:1px solid var(--hair);margin-top:auto;padding:14px 18px 2px;
 display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ash)}
.av{width:22px;height:22px;border:1px solid var(--hair);display:grid;place-items:center;
 font-size:10.5px;color:var(--paper);flex:none}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tbar{height:54px;border-bottom:1px solid var(--hair);display:flex;align-items:center;
 padding:0 20px;gap:10px;flex:none}
.mpill{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);
 padding:6px 11px;font-size:12.5px;white-space:nowrap}
.mpill em{font-style:normal;color:var(--dust);font-size:11px}
.tbar .right{margin-left:auto;display:flex;gap:16px;color:var(--dust);font-size:11.5px;align-items:center}
.dot{width:5px;height:5px;background:var(--paper);display:inline-block;margin-right:6px;
 animation:pulse 2.6s var(--e) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.22}}

.thread{flex:1;overflow-y:auto;padding:26px 0 12px}
.empty{max-width:44ch;margin:14vh auto 0;text-align:center;padding:0 20px;color:var(--ash)}
.empty .s{font-size:clamp(26px,4vw,38px);color:var(--paper);margin-bottom:10px;display:block}
.msg{padding:0 clamp(18px,4vw,40px) 24px;display:flex;gap:14px;max-width:900px}
.msg .who{width:24px;flex:none;padding-top:2px}
.msg .who .ic{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--ash);font-size:11px}
.msg.z .who .ic{border-color:transparent;background:var(--paper)}
.msg .body{min-width:0;flex:1}
.msg .name{font-size:11px;color:var(--dust);margin-bottom:6px}
.msg .txt{font-size:14.5px;line-height:1.62;white-space:pre-wrap;max-width:60ch}
.msg.u .txt{color:#D9D9D6}
.think{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dust);margin-bottom:8px}
.think i{width:4px;height:4px;background:var(--dust);border-radius:50%;display:inline-block;animation:pulse 1.2s var(--e) infinite}

.comp{flex:none;padding:0 clamp(18px,4vw,40px) 18px}
.box{border:1px solid var(--hair);background:#0A0A0B;padding:11px 12px 9px;display:flex;align-items:flex-end;gap:12px}
.box textarea{flex:1;background:none;border:0;resize:none;color:var(--paper);font:inherit;
 font-size:14px;line-height:1.5;max-height:120px;padding:6px 0}
.box textarea::placeholder{color:var(--dust)}
.box textarea:focus{outline:none}
.send{width:30px;height:30px;flex:none;background:var(--paper);color:var(--void);border:0;
 display:grid;place-items:center;font-size:14px;cursor:pointer;transition:opacity .2s}
.send:disabled{opacity:.3;cursor:default}
.foot{padding:9px 0 0;font-size:10.5px;color:var(--dust);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

@media(max-width:820px){
  .sb{display:none}
  .tbar{padding:0 16px}
  .mpill em{display:none}
}
@media(max-width:480px){
  .mpill span:not(em){font-size:12px}
  .foot{font-size:10px}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sb" id="sidebar">
    <a class="brand" href="/">
      <svg width="15" height="19" viewBox="0 0 64 114" aria-hidden="true"><g fill="#F4F4F1" transform="translate(-18,3)">
        <polygon points="52,19 82,-3 82,25 52,47"/><polygon points="18,22 82,58 82,86 18,50"/><polygon points="18,83 48,61 48,89 18,111"/>
      </g></svg><b>Sophetic</b>
    </a>
    <div class="newchat">+ New chat</div>
    <div class="sbl">Recent</div>
    <div class="hist" id="hist"></div>
    <div class="sbfoot"><span class="av">Y</span> Sophetic Free</div>
  </aside>

  <div class="main">
    <div class="tbar">
      <div class="mpill"><span>Zeno 1.0</span></div>
      <div class="mpill"><em>64k context</em></div>
      <div class="right"><span><i class="dot" aria-hidden="true"></i>Research preview</span></div>
    </div>

    <div class="thread" id="thread">
      <div class="empty" id="emptystate"><span class="s">Zeno</span>How can I help?</div>
    </div>

    <div class="comp">
      <div class="box">
        <textarea id="input" placeholder="Message Zeno…" rows="1" aria-label="Message Zeno"></textarea>
        <button class="send" id="send" disabled aria-label="Send">↑</button>
      </div>
      <div class="foot"><span>Zeno can make mistakes. Zeno has made <span id="mc">8</span> in this conversation.</span></div>
    </div>
  </div>

</div>

<script>
const $=id=>document.getElementById(id);
const HIST=['Checking a decision','Reviewing the Document','Terminal-Bench trace, run 14','Draft: responsible scaling','Is 27.1% good','Naming conventions','Explaining Units to a customer','Kiln, questions about'];
const REPLIES=[
  'We are experiencing high demand and cannot respond right now.',
  'Zeno is unavailable. Demand exceeded capacity a few minutes ago.',
  'We are aware. We cannot answer this right now.',
  'The Stoa is at capacity. Try again shortly.'
];
let mistakes=8;

const h=$('hist');
HIST.forEach((t,i)=>{
  const d=document.createElement('div');
  d.textContent=t; if(i===0) d.className='cur';
  h.appendChild(d);
});

const thread=$('thread'), input=$('input'), send=$('send'), mc=$('mc');
let empty=$('emptystate');

function autosize(){ input.style.height='auto'; input.style.height=Math.min(120,input.scrollHeight)+'px'; }
input.addEventListener('input',()=>{ send.disabled=!input.value.trim(); autosize(); });
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(input.value.trim()) submit(); }
});
send.addEventListener('click',()=>{ if(input.value.trim()) submit(); });

const zicon=`<svg width="10" height="13" viewBox="0 0 64 114" aria-hidden="true"><g fill="#08080A" transform="translate(-18,3)"><polygon points="52,19 82,-3 82,25 52,47"/><polygon points="18,22 82,58 82,86 18,50"/><polygon points="18,83 48,61 48,89 18,111"/></g></svg>`;

function addMsg(role,text){
  if(empty){ empty.remove(); empty=null; }
  const el=document.createElement('div');
  el.className='msg '+(role==='z'?'z':'u');
  el.innerHTML=`<div class="who"><div class="ic">${role==='z'?zicon:'Y'}</div></div>
    <div class="body"><div class="name">${role==='z'?'Zeno':'You'}</div><div class="txt"></div></div>`;
  el.querySelector('.txt').textContent=text;
  thread.appendChild(el);
  thread.scrollTop=thread.scrollHeight;
  return el;
}

function submit(){
  const text=input.value.trim();
  if(!text) return;
  input.value=''; input.style.height='auto'; send.disabled=true;
  addMsg('u',text);

  const think=document.createElement('div');
  think.className='msg z';
  think.innerHTML=`<div class="who"><div class="ic">${zicon}</div></div>
    <div class="body"><div class="name">Zeno</div><div class="think"><i></i>Thinking…</div></div>`;
  thread.appendChild(think);
  thread.scrollTop=thread.scrollHeight;

  setTimeout(()=>{
    think.remove();
    const line=REPLIES[Math.floor(Math.random()*REPLIES.length)];
    addMsg('z',line);
    mistakes+=1; mc.textContent=mistakes;
  }, 900+Math.random()*500);
}
</script>
</body>
</html>
